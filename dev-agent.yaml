project:
  name: dev-agent
  author: Dayvid Santana

documentation:
  priority: [AGENTS.md, docs/**, README.md]

context:
  include: [src/**, tests/**, docs/**, AGENTS.md, README.md]
  exclude: [.git/**, .venv/**, venv/**, node_modules/**, dist/**, build/**, coverage/**, __pycache__/**, "*.pyc", "*.log"]
  contextosAgentes: [agent-context/**]
  max_files: 12
  max_file_chars: 16000
  max_total_chars: 80000
  dependency_depth: 1

testing:
  command: pytest

testeAplicacao:
  # Configure urlBase e, se necessário, comandoInicial no projeto web ativo.
  urlBase: null
  comandoInicial: []
  origensPermitidas: []
  arquivoEstadoSessao: null
  capturarTelas: false
  permitirMutacoes: false
  ambienteDeTesteConfirmado: false
  comandoReset: []
  paginasMaximas: 24
  acoesMaximas: 120
  tempoLimiteSegundos: 180
  inicializacaoLimiteSegundos: 30
  limiteAcaoMs: 4000
  pastaArtefatos: .dev-agent/usabilidade
  motor: chromium
  jornadas: []

git:
  conventional_commits: true
  review_staged: true
  suggest_commit_split: true

headers:
  enabled: true
  author: Dayvid Santana
  date_format: "%d/%m/%Y"
  history: true

security:
  require_architecture_approval: true
  require_destructive_command_approval: true
